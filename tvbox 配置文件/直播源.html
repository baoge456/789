<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>直播源·灵动面板 | 潇雨萌萌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f0f5fa;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 20px 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        /* 头部 - 紧凑 */
        .panel-header {
            padding: 0.9rem 1.5rem;
            border-bottom: 1px solid #eef2f8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title-area h1 {
            font-size: 1.6rem;
            font-weight: 660;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1B3A5C 0%, #2D4B6E 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .title-area h1::before {
            content: "📡";
            font-size: 1.7rem;
            background: none;
            color: #2c6e9e;
        }

        /* 弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(4px);
        }
        .modal-card {
            background: white;
            max-width: 420px;
            width: 85%;
            border-radius: 28px;
            padding: 1.3rem;
            box-shadow: 0 25px 40px rgba(0,0,0,0.2);
            position: relative;
        }
        .modal-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #1B3A5C;
        }
        .modal-card p {
            font-size: 0.75rem;
            margin: 6px 0;
            line-height: 1.45;
            color: #2c3e66;
        }
        .modal-card code {
            background: #eef3fc;
            padding: 2px 6px;
            border-radius: 16px;
            font-size: 0.7rem;
        }
        .close-modal {
            position: absolute;
            top: 10px; right: 14px;
            font-size: 1.3rem;
            cursor: pointer;
            color: #8aa4c0;
        }
        .modal-btn {
            margin-top: 12px;
            background: #eef3fc;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        /* 直播源列表 - 减少右侧空白，让卡片内容撑满 */
        .source-list {
            padding: 0.8rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .source-card {
            background: #ffffff;
            border-radius: 20px;
            border: 1px solid #e8edf3;
            transition: all 0.2s ease;
        }
        .source-card:hover {
            border-color: #cbdde9;
            box-shadow: 0 6px 14px -8px rgba(0, 0, 0, 0.08);
            transform: translateY(-1px);
        }
        .card-row {
            padding: 0.8rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .info {
            flex: 1;
            min-width: 200px;
        }
        .source-name {
            font-weight: 620;
            font-size: 1rem;
            color: #1b2e44;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .source-tag {
            background: #eef3fc;
            padding: 3px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1f6392;
        }
        /* URL预览框 - 宽度自适应，不浪费右侧空间 */
        .url-preview {
            font-size: 0.75rem;
            color: #3a6b8f;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            word-break: break-all;
            font-family: 'SF Mono', 'Menlo', monospace;
            background: #f8fafd;
            padding: 5px 10px;
            border-radius: 14px;
            width: 100%;
            max-width: 100%;
        }
        .extra-note {
            background: #fef5e8;
            border-left: 3px solid #f4b942;
            padding: 6px 10px;
            margin-top: 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: #a65d2a;
            line-height: 1.4;
        }
        .action-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        .copy-icon, .open-icon {
            background: #ffffff;
            border: 1px solid #dfe6ed;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 7px;
            border-radius: 48px;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #2c5f8a;
            transition: 0.1s;
        }
        .copy-icon:hover, .open-icon:hover {
            background: #eef3fc;
            transform: scale(0.96);
        }

        /* 变量指引卡片 */
        .var-guide-card {
            background: #f9fafc;
            border-radius: 20px;
            margin: 0 1.5rem 1rem 1.5rem;
            padding: 1rem 1.2rem;
            border: 1px solid #e5ecf3;
        }
        .step-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.8rem;
            color: #2c3e66;
        }
        .step-num {
            background: #eef3fc;
            border-radius: 50px;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            color: #2c6e9e;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .inline-wx {
            display: inline-flex;
            align-items: center;
            background: #eef3fc;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #1a6392;
            cursor: pointer;
            margin-left: 8px;
            font-weight: 500;
        }
        button {
            background: none;
            border: none;
            font-family: inherit;
        }

        /* Toast提示 */
        .toast-msg {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) scale(0.92);
            background: #2c3e50e6;
            backdrop-filter: blur(12px);
            color: white;
            padding: 10px 24px;
            border-radius: 56px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* 底部 */
        .panel-footer {
            padding: 0.7rem 1.5rem;
            border-top: 1px solid #eef2f8;
            font-size: 0.7rem;
            color: #6d8aac;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .footer-note {
            background: #f0f6fe;
            padding: 4px 14px;
            border-radius: 24px;
            color: #1a6392;
            font-size: 0.7rem;
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .source-list, .var-guide-card { margin-left: 1rem; margin-right: 1rem; }
            .card-row { flex-direction: column; align-items: stretch; }
            .action-group { justify-content: flex-end; margin-top: 6px; }
            .toast-msg { white-space: normal; max-width: 80%; text-align: center; font-size: 0.75rem; }
            .title-area h1 { font-size: 1.4rem; }
            .url-preview { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

<div class="panel">
    <div class="panel-header">
        <div class="title-area">
            <h1>📺 直播源 · 灵动面板</h1>
        </div>
    </div>

    <div class="source-list" id="sourceListContainer"></div>

    <!-- 获取变量值区域，公众号已内嵌到此卡片中 -->
    <div class="var-guide-card">
        <div style="font-weight:700; font-size:0.85rem; display: flex; align-items: center; flex-wrap: wrap; gap: 8px;">
            <span>🔁 获取最新变量值（替换主源后缀）</span>
            <span id="wxInlineBtn" class="inline-wx">📘 公众号: 潇雨萌萌</span>
        </div>
        <div class="step-list">
            <div class="step-item"><span class="step-num">1</span> 打开公众号文章《IPTV Workers 调整说明》→ 留言区</div>
            <div class="step-item"><span class="step-num">2</span> 找到最新变量值（例如 /2026abc）</div>
            <div class="step-item"><span class="step-num">3</span> 点击下方按钮输入 → 面板自动生效</div>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px;">
            <button id="updateSuffixMainBtn" style="background:#eef3fc; padding: 6px 18px; border-radius: 40px; font-size:0.75rem; font-weight:600; cursor:pointer;">✏️ 更新主源后缀</button>
            <button id="openArticleBtn" style="background:#fff0db; padding: 6px 18px; border-radius: 40px; font-size:0.75rem; font-weight:600; cursor:pointer;">📖 直达文章留言区</button>
        </div>
    </div>

    

<div id="toastMsg" class="toast-msg">✅ 操作成功</div>

<script>
    // ---------- 直播源数据 ----------
    const BASE_SELF_URL = "https://zby.baoge123.de5.net";
    const BASE_OK_URL = "https://ok.baoge123.de5.net";
    
    let currentSuffix = localStorage.getItem('dynamic_iptv_suffix') || "/请从留言区获取最新值";

    function getMainSourceUrl() {
        return `${BASE_SELF_URL}${currentSuffix}`;
    }
    function getOkSourceUrl() {
        return `${BASE_OK_URL}${currentSuffix}`;
    }

    const STATIC_SOURCES = [
        {
            id: "vps",
            name: "VPS部署节点",
            displayName: "🖥️ VPS高性能部署 · live.m3u",
            url: "https://yzby.baoge123.de5.net/live.m3u",
            note: "独立VPS",
            tag: "VPS"
        },
        {
            id: "sd",
            name: "山东稳定源",
            displayName: "📡 山东稳定源 · M3U",
            url: "https://dfile.baoge.wang/sd.m3u",
            note: "高清稳定",
            tag: "山东"
        },
        {
            id: "stymei",
            name: "stymei源",
            displayName: "📺 stymei · iptv列表",
            url: "https://dfile.baoge.wang/iptv.txt",
            note: "纯文本",
            tag: "styme"
        }
    ];

    let mainSource = {
        id: "main",
        name: "自建主源",
        displayName: "✨ 自建主源 · 接口已升级 (通用)",
        url: getMainSourceUrl(),
        note: `后缀 ${currentSuffix}`,
        tag: "主源",
        showSuffixWarning: true,
        isDynamic: true
    };
    
    let okSource = {
        id: "ok_main",
        name: "OK影视专用源",
        displayName: "🎬 OK影视专用源 · 自动刷新优化",
        url: getOkSourceUrl(),
        note: `后缀 ${currentSuffix} · 针对OK影视调优`,
        tag: "OK影视",
        showSuffixWarning: false,
        isDynamic: true
    };

    let toastTimer = null;
    function showToast(msg, isErr = false) {
        const toast = document.getElementById('toastMsg');
        if (!toast) return;
        if (toastTimer) clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.style.background = isErr ? "#c0392be6" : "#2c3e50e6";
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2100);
    }

    async function copyToClipboard(text, name) {
        if (!text) return;
        try {
            await navigator.clipboard.writeText(text);
            showToast(`✅ 已复制 ${name}`, false);
        } catch {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed'; ta.style.top = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast(`📋 ${name} 已复制`, false);
        }
    }

    function openLink(url, name) {
        if (!url) { showToast(`❌ 地址无效`, true); return; }
        if (!url.startsWith('http')) { showToast(`⚠️ 仅支持http/https`, true); return; }
        window.open(url, '_blank', 'noopener,noreferrer');
        showToast(`🔗 打开 ${name}`, false);
    }

    function getShortPreview(url) {
        try {
            let u = new URL(url);
            let host = u.hostname;
            let path = u.pathname;
            if (path.length > 28) path = path.substring(0, 24) + '…';
            return host + path;
        } catch(e) {
            return url.length > 45 ? url.substring(0, 42) + '…' : url;
        }
    }

    function refreshAllDynamicSources() {
        mainSource.url = getMainSourceUrl();
        mainSource.note = `后缀 ${currentSuffix} (接口已升级，无需重新部署)`;
        okSource.url = getOkSourceUrl();
        okSource.note = `后缀 ${currentSuffix} · 针对OK影视调优 (自动刷新)`;
        renderCards();
        localStorage.setItem('dynamic_iptv_suffix', currentSuffix);
    }

    function promptUpdateSuffix() {
        let newVal = prompt("✏️ 请输入公众号留言区最新变量值（包含斜杠，如 /2026abc）：", currentSuffix);
        if (newVal && newVal.trim() !== "") {
            let raw = newVal.trim();
            if (!raw.startsWith('/')) raw = '/' + raw;
            if (raw === currentSuffix) { showToast("后缀未变动", false); return; }
            currentSuffix = raw;
            refreshAllDynamicSources();
            showToast(`✅ 主源后缀已更新为 ${currentSuffix}，OK影视源同步生效`, false);
        }
    }

    function openArticle() {
        window.open("https://mp.weixin.qq.com/s/MEt5hSqoblpOLW9j42yD4g", '_blank');
        showToast("📖 打开文章，下拉至留言区获取最新变量值", false);
        setTimeout(() => navigator.clipboard.writeText("潇雨萌萌").catch(()=>{}), 200);
    }

    function copyWxName() {
        navigator.clipboard.writeText("潇雨萌萌");
        showToast("📘 公众号名称「潇雨萌萌」已复制，微信内搜索关注", false);
    }

    function renderCards() {
        const container = document.getElementById('sourceListContainer');
        if (!container) return;
        container.innerHTML = '';
        mainSource.url = getMainSourceUrl();
        okSource.url = getOkSourceUrl();
        const all = [mainSource, okSource, ...STATIC_SOURCES];

        all.forEach(src => {
            const card = document.createElement('div');
            card.className = 'source-card';
            const row = document.createElement('div');
            row.className = 'card-row';
            const info = document.createElement('div');
            info.className = 'info';
            const nameDiv = document.createElement('div');
            nameDiv.className = 'source-name';
            const tagSpan = document.createElement('span');
            tagSpan.className = 'source-tag';
            tagSpan.textContent = src.tag;
            nameDiv.appendChild(tagSpan);
            const nameSpan = document.createElement('span');
            nameSpan.style.fontWeight = '600';
            nameSpan.textContent = src.displayName;
            nameDiv.appendChild(nameSpan);
            const preview = document.createElement('div');
            preview.className = 'url-preview';
            preview.innerHTML = `🔗 <span style="font-family:monospace;">${getShortPreview(src.url)}</span> ${src.note ? `· ${src.note}` : ''}`;
            info.appendChild(nameDiv);
            info.appendChild(preview);

            if (src.showSuffixWarning && src.id === 'main') {
                const warn = document.createElement('div');
                warn.className = 'extra-note';
                warn.innerHTML = `⚠️ 当前共用后缀 <strong>${currentSuffix}</strong> · 原代码库已升级，<strong>无需重新部署 Workers</strong>，仅需从留言区获取最新后缀替换。<br>📌 推荐使用 DIYP / KU9 / OK影视 等支持自动刷新接口的软件。更新后缀后两个主源同时生效。`;
                info.appendChild(warn);
            } else if (src.id === 'ok_main') {
                const smallNote = document.createElement('div');
                smallNote.style.fontSize = '0.65rem';
                smallNote.style.color = '#8faa7c';
                smallNote.style.marginTop = '4px';
                smallNote.innerHTML = `💡 后缀与自建主源同步更新，一键复制即可用于OK影视`;
                info.appendChild(smallNote);
            }

            const actions = document.createElement('div');
            actions.className = 'action-group';
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-icon';
            copyBtn.innerHTML = '📋';
            copyBtn.onclick = () => copyToClipboard(src.url, src.displayName);
            const openBtn = document.createElement('button');
            openBtn.className = 'open-icon';
            openBtn.innerHTML = '🔗';
            openBtn.onclick = () => openLink(src.url, src.displayName);
            actions.appendChild(copyBtn);
            actions.appendChild(openBtn);
            row.appendChild(info);
            row.appendChild(actions);
            card.appendChild(row);
            container.appendChild(card);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        const stored = localStorage.getItem('dynamic_iptv_suffix');
        if (stored && stored !== currentSuffix) {
            currentSuffix = stored;
            refreshAllDynamicSources();
        } else {
            renderCards();
        }
        const updateBtn = document.getElementById('updateSuffixMainBtn');
        if (updateBtn) updateBtn.addEventListener('click', promptUpdateSuffix);
        const articleBtn = document.getElementById('openArticleBtn');
        if (articleBtn) articleBtn.addEventListener('click', openArticle);
        const wxInline = document.getElementById('wxInlineBtn');
        if (wxInline) wxInline.addEventListener('click', copyWxName);
    });
</script>
</body>
</html>
