<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>最强直播源 · 裤佬珍藏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f1f5f9 0%, #e6edf4 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* 头部 - 极简 */
        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .hero h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #0f2b3d, #1e4a6e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }
        .hero p {
            color: #5a6e8a;
            margin-top: 6px;
            font-size: 0.85rem;
        }

        /* 双栏卡片布局，优雅简洁 */
        .grid-panels {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.8rem;
            margin-bottom: 2rem;
        }

        .card {
            background: rgba(255,255,255,0.94);
            backdrop-filter: blur(2px);
            border-radius: 1.8rem;
            box-shadow: 0 18px 30px -10px rgba(0,0,0,0.08);
            transition: all 0.25s ease;
            border: 1px solid rgba(255,255,255,0.7);
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 22px 35px -12px rgba(0,0,0,0.15);
            background: white;
        }

        .card-header {
            padding: 1.2rem 1.5rem 0.6rem 1.5rem;
            border-bottom: 1px solid #eef2f8;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header h2 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #0c4a6e;
        }
        .card-header i {
            font-size: 1.5rem;
        }

        .card-content {
            padding: 1.3rem 1.5rem 1.8rem;
        }

        /* 直播源条目样式 */
        .source-item {
            background: #f8fafc;
            border-radius: 1.2rem;
            padding: 0.85rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid #e2edf7;
            transition: 0.15s;
        }
        .source-item:hover {
            background: white;
            border-color: #cbdff2;
        }
        .source-url {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.78rem;
            word-break: break-all;
            color: #1f3a5f;
            background: #eef3fc;
            padding: 6px 14px;
            border-radius: 40px;
            flex: 2;
            min-width: 170px;
        }

        .btn-copy {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 7px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.73rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #1e293b;
            box-shadow: 0 1px 1px rgba(0,0,0,0.02);
        }
        .btn-copy:hover {
            background: #0f172a;
            border-color: #0f172a;
            color: white;
            transform: scale(0.97);
        }
        .btn-copy:active {
            background: #f97316;
            border-color: #f97316;
        }

        /* 书签卡片内部特殊样式 */
        .bookmark-wrapper {
            background: #fefce8;
            border-radius: 1.2rem;
            padding: 0.9rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid #fde68a;
            margin-bottom: 0.5rem;
        }
        .bookmark-url {
            font-family: monospace;
            font-size: 0.82rem;
            background: #fff7e0;
            padding: 6px 14px;
            border-radius: 32px;
            word-break: break-all;
            color: #92400e;
            flex: 2;
        }
        .badge-owner {
            background: #fee2e2;
            color: #b91c1c;
            font-size: 0.7rem;
            padding: 4px 14px;
            border-radius: 50px;
            font-weight: 500;
            display: inline-block;
        }
        .tip-note {
            margin-top: 16px;
            background: #eef2ff;
            border-radius: 1rem;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.75rem;
            color: #1e3a8a;
        }
        .global-copy {
            background: #1e293b;
            border: none;
            padding: 6px 20px;
            border-radius: 40px;
            color: white;
            font-weight: 500;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .global-copy:hover {
            background: #f97316;
        }

        /* toast提示 */
        .toast-msg {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 8px 22px;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 500;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            backdrop-filter: blur(12px);
            background: rgba(0,0,0,0.85);
            white-space: nowrap;
        }
        footer {
            text-align: center;
            margin-top: 2.2rem;
            font-size: 0.7rem;
            color: #6c86a3;
            border-top: 1px solid #dce5ef;
            padding-top: 1.5rem;
        }
        @media (max-width: 680px) {
            body { padding: 1rem; }
            .source-url { font-size: 0.7rem; }
            .btn-copy { padding: 5px 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="hero">
        <h1>最强直播源</h1>
        <p>裤佬珍藏 · 秒级复制 即拿即用</p>
    </div>

    <div class="grid-panels">
        <!-- 面板1：核心直播源 -->
        <div class="card">
            <div class="card-header">
                <i>📡</i>
                <h2>裤佬直播源</h2>
            </div>
            <div class="card-content">
                <div class="source-item">
                    <span class="source-url">http://43.251.226.110:9991/ayuy53</span>
                    <button class="btn-copy" data-url="http://43.251.226.110:9991/ayuy53">📋 复制</button>
                </div>
                <div class="source-item">
                    <span class="source-url">http://43.251.226.110:9991/oy2m9j</span>
                    <button class="btn-copy" data-url="http://43.251.226.110:9991/oy2m9j">📋 复制</button>
                </div>
                <div class="tip-note">
                    <span>🔗 高速线路 · 稳定播放</span>
                    <span>✅ 支持PotPlayer/OTT</span>
                </div>
            </div>
        </div>

        <!-- 面板2：裤佬书签收藏 -->
        <div class="card">
            <div class="card-header">
                <i>🔖</i>
                <h2>裤佬书签收藏</h2>
            </div>
            <div class="card-content">
                <div class="bookmark-wrapper">
                    <span class="bookmark-url">https://jsnzkpg.github.io/</span>
                    <button class="btn-copy" data-url="https://jsnzkpg.github.io/">📋 复制</button>
                </div>
                <div style="margin-top: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                    <span class="badge-owner">⭐ 裤佬推荐</span>
                    <span style="font-size: 0.7rem; color:#b45309;">GitHub 私人书签 · 精品聚合</span>
                </div>
                <!-- 附加一键复制全部（仅这两个源的三个链接） -->
                <div style="margin-top: 20px;">
                    <button id="copyAllBtn" class="global-copy" style="width: 100%;">📑 一键复制全部链接</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        🌟 点击任意「复制」按钮，地址立即存入剪贴板 | 源永久维护
    </footer>
</div>

<div id="copyToast" class="toast-msg">✅ 已复制</div>

<script>
    (function(){
        const copyButtons = document.querySelectorAll('.btn-copy[data-url]');
        const toastEl = document.getElementById('copyToast');
        let toastTimeout = null;

        function showToast(msg, isError = false) {
            if (toastTimeout) clearTimeout(toastTimeout);
            toastEl.textContent = msg || (isError ? '❌ 复制失败' : '✅ 已复制');
            toastEl.style.opacity = '1';
            toastEl.style.background = isError ? 'rgba(185,28,28,0.9)' : 'rgba(15,35,60,0.92)';
            toastTimeout = setTimeout(() => {
                toastEl.style.opacity = '0';
            }, 1500);
        }

        async function copyToClipboard(text, btnElement) {
            try {
                await navigator.clipboard.writeText(text);
                showToast('✅ 已复制: ' + (text.length > 40 ? text.substring(0,40)+'…' : text));
                if (btnElement) {
                    const original = btnElement.innerHTML;
                    btnElement.innerHTML = '✓ 已复制';
                    setTimeout(() => { btnElement.innerHTML = original; }, 1000);
                }
            } catch (err) {
                // fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('📋 复制成功', false);
                if (btnElement) {
                    const original = btnElement.innerHTML;
                    btnElement.innerHTML = '✓ 已复制';
                    setTimeout(() => { btnElement.innerHTML = original; }, 1000);
                }
            }
        }

        copyButtons.forEach(btn => {
            const url = btn.getAttribute('data-url');
            if (url) {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    copyToClipboard(url, btn);
                });
            }
        });

        // 一键复制全部: 两个直播源 + 书签
        const copyAllBtn = document.getElementById('copyAllBtn');
        if (copyAllBtn) {
            copyAllBtn.addEventListener('click', async () => {
                const allLinks = [
                    'http://43.251.226.110:9991/ayuy53',
                    'http://43.251.226.110:9991/oy2m9j',
                    'https://jsnzkpg.github.io/'
                ];
                const result = allLinks.join('\n');
                try {
                    await navigator.clipboard.writeText(result);
                    showToast(`🎉 已复制 ${allLinks.length} 个链接`, false);
                    const originalText = copyAllBtn.innerHTML;
                    copyAllBtn.innerHTML = '✅ 已复制全部';
                    setTimeout(() => { copyAllBtn.innerHTML = originalText; }, 1500);
                } catch (err) {
                    const textarea = document.createElement('textarea');
                    textarea.value = result;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast(`📦 已复制 ${allLinks.length} 条链接`, false);
                    const originalText = copyAllBtn.innerHTML;
                    copyAllBtn.innerHTML = '✅ 已复制全部';
                    setTimeout(() => { copyAllBtn.innerHTML = originalText; }, 1500);
                }
            });
        }
    })();
</script>
</body>
</html>
