<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快点挪车-信息</title>
  <style>
    /* 原 bootstrap 外链（215KB）去掉，仅内联本页用到的样式，效果不变 */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #212529;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(160deg, #eefaf0 0%, #eaf2ff 55%, #fdf4e7 100%);
      margin: 0;
    }
    .container {
      max-width: 440px;
      width: 98%;
      padding: 20px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.1);
      border-radius: 36px;
      background-color: #fff;
      text-align: center;
      border: 5px solid green;
    }
    .car {
      color: #fff;
      background: linear-gradient(180deg, #5b6cd4 0%, #3d4da8 100%);
      border-radius: 6px;
      border: 1px solid #fff;
      padding: 15px 0;
      box-shadow: 0 0 2px 4px #4b5cc4, inset 0 2px 4px rgba(255, 255, 255, 0.35);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      font-size: 32px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: #fff;
      border: 1px solid rgba(0, 0, 0, 0.125);
      border-radius: 0.375rem;
      text-align: center;
    }
    .card-body {
      flex: 1 1 auto;
      padding: 0.75rem 0.5rem;
    }
    .card-title {
      margin-bottom: 0.5rem;
      font-size: 1.17em;
      font-weight: 500;
      line-height: 1.2;
    }
    /* 纯 CSS 重画的横幅，替代原图床图片 */
    .banner {
      padding: 10px 4px;
    }
    .banner-badges {
      display: flex;
    }
    .banner-badges span {
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 5px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, 0.22);
    }
    /* 贴纸感：角标放大、歪斜、互相叠压，照原图排布 */
    .banner-badges span:nth-child(1) { transform: rotate(-14deg); }
    .banner-badges span:nth-child(2) { transform: rotate(6deg); margin-left: -4px; }
    .banner-badges span:nth-child(3) { transform: rotate(-8deg); margin-left: -3px; }
    .banner-badges span:nth-child(4) { transform: rotate(10deg); margin-left: -4px; }
    .banner-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      padding: 2px 6px 10px;
    }
    .banner-tiles {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
    }
    .banner-tiles span {
      color: #fff;
      font-weight: 700;
      font-size: clamp(24px, 7.2vw, 34px);
      line-height: 1;
      padding: 0.2em 0.08em 0.26em;
      border-radius: 9px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.22);
    }
    .banner-en {
      font-size: 12px;
      letter-spacing: 3px;
      color: #444;
    }
    /* “联系车主”书法字，替代原图床图片 */
    .contact-title {
      font-family: 'STXingkai', '华文行楷', 'KaiTi', '楷体', 'DFKai-SB', serif;
      font-size: 30px;
      font-weight: 700;
      color: #15803d;
      letter-spacing: 6px;
      margin-bottom: 0.2em;
    }
    /* 三块紧凑间距，替代原来的 <br> 硬凑 */
    .car {
      margin-top: 22px;
    }
    #cardContainer {
      margin-top: 22px;
    }
    .btn {
      margin: 16px auto;
      padding: 14px 46px; /* 按钮尺寸：保证拇指热区高度 ≥60px */
      font-size: 24px; /* 增大字体 */
    }
    /* 以下三条复刻 bootstrap 的 .btn/.btn-primary，写在自定义 .btn 之后，顺序即覆盖关系 */
    .btn {
      display: inline-block;
      font-weight: 400;
      text-align: center;
      text-decoration: none;
      vertical-align: middle;
      cursor: pointer;
      user-select: none;
      border: 1px solid transparent;
      border-radius: 0.375rem;
    }
    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, #5b9bff 0%, #0d6efd 100%);
      border-color: #0d6efd;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.35);
    }
    .btn-primary:hover {
      color: #fff;
      background: linear-gradient(135deg, #4a8af4 0%, #0b5ed7 100%);
      border-color: #0a58ca;
    }
    .car-image {
      max-width: 50%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card-body">
        <h3 class="card-title">
          <div class="banner">
            <div class="banner-top">
              <div class="banner-badges">
                <span style="background:#f39c12;">温</span>
                <span style="background:#16a085;">馨</span>
                <span style="background:#e91e63;">提</span>
                <span style="background:#3498db;">示</span>
              </div>
              <div class="banner-en">temporary parking please</div>
            </div>
            <div class="banner-tiles">
              <span style="background:#d93025;">临</span>
              <span style="background:#1a73e8;">时</span>
              <span style="background:#188038;">停</span>
              <span style="background:#3949ab;">车</span>
              <span style="background:#00897b;">请</span>
              <span style="background:#8e24aa;">多</span>
              <span style="background:#283593;">关</span>
              <span style="background:#c62828;">照</span>
            </div>
          </div>
        </h3>
      </div>
    </div>
    <div class="car">
      <span class="car-province">京</span>
      <span class="car-letter">A</span>
      <span class="car-dot">•</span>
      <span class="car-number">12345</span>
    </div>
    <div id="cardContainer"></div>
  </div>
 
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const plateNumber = urlParams.get('plateNumber');
    const phoneNumber = urlParams.get('phoneNumber');

    const carProvince = document.querySelector('.car-province');
    const carLetter = document.querySelector('.car-letter');
    const carNumber = document.querySelector('.car-number');

    if (plateNumber && plateNumber.length >= 2) {
      carProvince.textContent = plateNumber.charAt(0);
      carLetter.textContent = plateNumber.charAt(1);
      carNumber.textContent = plateNumber.slice(2);
    }

    const cardContent = `
      <div class="card">
        <div class="card-body">
          <h3 class="card-title">
            <div class="contact-title">联系车主</div>
          </h3>
          <a class="btn btn-primary" href="tel:${phoneNumber || ''}">一键呼叫</a>
        </div>
      </div>
    `;
 
    const cardContainer = document.getElementById('cardContainer');
    cardContainer.innerHTML = cardContent;
  </script>
</body>
</html>
