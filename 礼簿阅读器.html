<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>礼簿阅读器 · 宝哥工作室</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<style>
    :root {
        --ui-bg: #ece5d8;
        --ui-ink: #3a352e;
        --ui-sub: #7a705f;
        --ui-line: #cabfa9;
        --ui-card: #fbf8f1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
        background: var(--ui-bg);
        color: var(--ui-ink);
        font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    }

    /* ============ 工具栏 ============ */
    .bar {
        flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding: 10px 16px; background: var(--ui-card); border-bottom: 1px solid var(--ui-line);
        box-shadow: 0 2px 8px rgba(0,0,0,.05); z-index: 20;
    }
    .bar .brand { font-weight: 700; letter-spacing: 2px; font-size: 16px; margin-right: 6px; }
    .bar .brand small { display: block; font-weight: 400; font-size: 11px; color: var(--ui-sub); letter-spacing: 1px; }
    .bar .sp { flex: 1 1 auto; }
    .btn {
        font: inherit; cursor: pointer; border: 1px solid var(--ui-line); background: #fff;
        color: var(--ui-ink); padding: 7px 14px; border-radius: 8px; font-size: 13px; letter-spacing: 1px;
        transition: background .15s, border-color .15s;
    }
    .btn:hover { background: #f0ead9; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.on { background: var(--ui-ink); color: #fff; border-color: var(--ui-ink); }
    .seg { display: inline-flex; border: 1px solid var(--ui-line); border-radius: 8px; overflow: hidden; }
    .seg .btn { border: 0; border-radius: 0; }
    .seg .btn + .btn { border-left: 1px solid var(--ui-line); }
    .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ui-sub); }
    .filetag { font-size: 12px; color: var(--ui-sub); max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pgnum { font-size: 13px; color: var(--ui-ink); min-width: 84px; text-align: center; letter-spacing: 1px; }

    /* ============ 舞台 ============ */
    .stage {
        flex: 1 1 auto; position: relative; display: flex; align-items: center; justify-content: center;
        padding: 18px; overflow: hidden;
        background:
            radial-gradient(circle at 50% 30%, #f3eee2 0%, #ece5d8 55%, #ddd2bd 100%);
    }
    .book-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
    /* 书壳侧边堆叠 + 中缝阴影，衬托翻页纸感 */
    .book-shell { position: relative; filter: drop-shadow(0 26px 40px rgba(60,45,25,.34)); }
    .book-shell::before, .book-shell::after {
        content: ""; position: absolute; top: 12px; bottom: 12px; width: 11px; z-index: -1;
        background: repeating-linear-gradient(to bottom, #f6f2ea 0 2px, #d3c9b4 2px 3px);
        box-shadow: 0 6px 14px rgba(0,0,0,.18);
    }
    .book-shell::before { left: -7px; border-radius: 7px 0 0 7px; }
    .book-shell::after { right: -7px; border-radius: 0 7px 7px 0; }
    #book { position: relative; width: 100%; height: 100%; }
    .flip-book { position: absolute; inset: 0; width: 100%; height: 100%; }

    .empty-tip {
        position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px;
        align-items: center; justify-content: center; color: var(--ui-sub); text-align: center; padding: 20px;
    }
    .empty-tip .big { font-size: 42px; }
    .empty-tip h3 { margin: 0; font-weight: 600; color: var(--ui-ink); letter-spacing: 2px; }
    .empty-tip p { margin: 0; font-size: 13px; line-height: 1.9; }

    /* 拖放遮罩 */
    .dropmask {
        position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(120,90,50,.12); border: 2px dashed var(--ui-sub); z-index: 15;
        color: var(--ui-ink); font-size: 18px; letter-spacing: 3px; pointer-events: none;
    }
    .stage.dragover .dropmask { display: flex; }

    /* ============ 缩略图抽屉 ============ */
    .toc {
        position: absolute; top: 0; right: 0; bottom: 0; width: 208px; background: var(--ui-card);
        border-left: 1px solid var(--ui-line); box-shadow: -6px 0 16px rgba(0,0,0,.08);
        transform: translateX(100%); transition: transform .22s; overflow-y: auto; padding: 10px; z-index: 18;
    }
    .toc.open { transform: translateX(0); }
    .toc h4 { margin: 4px 4px 10px; font-size: 13px; color: var(--ui-sub); letter-spacing: 2px; }
    .toc .thumb { cursor: pointer; border: 1px solid var(--ui-line); border-radius: 4px; margin-bottom: 8px; overflow: hidden; background: #fff; }
    .toc .thumb .cap { font-size: 10px; color: var(--ui-sub); padding: 2px 5px; border-top: 1px solid #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toc .thumb .mini { pointer-events: none; }

    /* ============ 通用翻页页 ============ */
    .page { background: #fff; overflow: hidden; position: relative; }
    .page.blank { background: #faf6ee; }
    .page-inner { position: absolute; top: 0; left: 0; width: 1123px; height: 794px; transform-origin: 0 0; transform: scale(var(--ps, 1)); }
    .vf { width: 100%; height: 100%; display: block; object-fit: contain; background: #fff; }

    /* ============================================================
       通用记账 · 定稿封面/封底（横版 A4，红白两皮）
       —— 与 _礼簿封面预览.html 一致：前封=礼簿+公事名+日期，封底=居中礼章+工作室
       ============================================================ */
    .cover {
        --bg: #b23b2e; --ink: #f3e2c0; --line: #d9b45b; --accent: #e8c877; --sub: #f6e7c6;
        position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(circle at 50% 42%, #c04a3a 0%, #b23b2e 60%, #9c2f24 100%);
    }
    .cover.white {
        --ink: #2f3b45; --line: #4a5568; --accent: #6b7a89; --sub: #5b4a3f;
        background: radial-gradient(circle at 50% 42%, #f7f2e9 0%, #f2ece1 70%, #e7ddcc 100%);
    }
    .cover .frame { position: absolute; inset: 41px; border: 5px solid var(--line); border-radius: 4px; }
    .cover .frame::after { content: ""; position: absolute; inset: 13px; border: 2px solid var(--line); opacity: .8; }
    .cover .cor { position: absolute; width: 51px; height: 51px; border: 0 solid var(--accent); }
    .cover .cor.tl { top: 56px; left: 56px; border-top-width: 8px; border-left-width: 8px; }
    .cover .cor.tr { top: 56px; right: 56px; border-top-width: 8px; border-right-width: 8px; }
    .cover .cor.bl { bottom: 56px; left: 56px; border-bottom-width: 8px; border-left-width: 8px; }
    .cover .cor.br { bottom: 56px; right: 56px; border-bottom-width: 8px; border-right-width: 8px; }
    .cover .title-wrap {
        position: absolute; top: 150px; left: 0; right: 0; bottom: 150px;
        display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 44px;
    }
    .cover .v-title {
        writing-mode: vertical-rl; text-orientation: upright;
        font-family: "KaiTi","STKaiti","楷体",serif; font-size: 124px; font-weight: 700;
        color: var(--ink); letter-spacing: 22px; line-height: 1;
    }
    .cover .ename { font-family: "KaiTi","STKaiti","楷体",serif; font-size: 52px; color: var(--sub); letter-spacing: 15px; }
    .cover .meta { position: absolute; bottom: 78px; left: 0; right: 0; text-align: center; font-size: 32px; color: var(--sub); letter-spacing: 5px; }
    .cover .bk-emblem { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 42px; }
    .cover .bk-brand { font-size: 38px; color: var(--sub); letter-spacing: 13px; }

    /* ============================================================
       竖排内页（复刻打印页 .vb-* 几何，pt 单位 = 打印一致）
       ============================================================ */
    .vb {
        --vb-main: #bc3f2e; --vb-line: #333; --vb-sub: #555;
        position: absolute; inset: 0; width: 100%; height: 100%;
        display: flex; flex-direction: column; padding: 1cm 1cm 0 1.7cm; overflow: hidden;
        background: #fff; font-family: "KaiTi","STKaiti","楷体",serif; color: #000;
    }
    .vb.white { --vb-main: #2c6e8f; }
    .vb .vb-side-title {
        position: absolute; top: 50%; right: 6mm; transform: translateY(-50%);
        writing-mode: vertical-rl; font-size: 12pt; font-weight: bold; color: #333; letter-spacing: 2px;
    }
    .vb .vb-body { display: flex; flex-direction: column; border-top: 2px solid var(--vb-line); flex: 1; }
    .vb .vb-row { display: flex; width: 100%; flex: 3; }
    .vb .vb-cell {
        flex: 1; border-right: 2px solid var(--vb-line); border-bottom: 2px solid var(--vb-line);
        display: flex; justify-content: center; align-items: center;
        writing-mode: vertical-lr; text-orientation: upright; font-weight: bold;
        font-size: 18pt; letter-spacing: 2px; line-height: 1.05; padding: 4px 2px; overflow: visible; white-space: nowrap;
    }
    .vb .vb-cell:first-child { border-left: 2px solid var(--vb-line); }
    .vb .vb-name-cell .vb-name { font-size: 24pt; text-align: center; white-space: nowrap; letter-spacing: 2px; line-height: 1.05; }
    .vb .vb-type-cell { color: var(--vb-main); font-family: SimSun,"宋体",serif; font-size: 18pt; }
    .vb .vb-amount-cell { position: relative; writing-mode: vertical-lr; text-orientation: upright; padding: 4px 2px 20px 2px; }
    .vb .vb-amount-chinese { font-size: 22pt; text-align: center; white-space: nowrap; letter-spacing: 2px; line-height: 1.05; }
    .vb .vb-amount-numeric {
        position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
        writing-mode: horizontal-tb; text-orientation: mixed; font-size: 9pt; color: #555;
        letter-spacing: 0; white-space: nowrap;
    }
    .vb .vb-footer { flex-shrink: 0; display: flex; justify-content: space-between; align-items: flex-end; font-size: 18px; padding: 10px 25px 0; margin-top: auto; }
    .vb .vb-footer p { margin: 3px 0; }
    .vb .vb-footer-totals { display: flex; align-items: baseline; gap: 3em; text-align: right; }
    .vb .vb-page-number { text-align: center; flex-grow: 1; }
    .vb .vb-appendix-table, .vb .vb-expense-table { width: 100%; border-collapse: collapse; font-size: 16px; text-align: center; }
    .vb .vb-appendix-table th, .vb .vb-appendix-table td,
    .vb .vb-expense-table th, .vb .vb-expense-table td {
        border: 1px solid var(--vb-line); padding: 6px 8px; font-family: "KaiTi",serif; font-size: 16px; letter-spacing: 1px;
    }
    .vb .vb-appendix-table th, .vb .vb-expense-table th { background: #f2f2f2; font-weight: bold; }

    /* 汇总统计页 */
    .stat {
        position: absolute; inset: 0; width: 100%; height: 100%; padding: 1.6cm 1.8cm; overflow: hidden;
        background: #fff; font-family: "KaiTi","STKaiti","楷体",serif; color: #1c1c1c;
        display: flex; flex-direction: column;
    }
    .stat h2 { margin: 0 0 0.6cm; font-size: 26pt; letter-spacing: 4px; border-left: 6px solid var(--vb-main, #bc3f2e); padding-left: 12px; }
    .stat.white h2 { border-left-color: #2c6e8f; }
    .stat .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 26px; }
    .stat .kv { display: flex; justify-content: space-between; border-bottom: 1px dashed #c8bfa8; padding: 10px 4px; font-size: 15pt; }
    .stat .kv .k { color: #666; }
    .stat .kv .v { font-weight: bold; }
    .stat .note { margin-top: auto; font-size: 11pt; color: #999; text-align: right; }

    /* 缩略图缩放容器 */
    .mini-box { position: relative; overflow: hidden; background: #fff; }
</style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100%;">
    <!-- ============ 工具栏 ============ -->
    <div class="bar">
        <div class="brand">礼簿阅读器<small>宝哥工作室 · 本地翻书</small></div>

        <button class="btn" @click="pickFile" title="导入 JSON 或 PDF（也可直接把文件拖进画面）">📂 导入 JSON / PDF</button>
        <input ref="fileInput" type="file" accept=".json,.pdf" style="display:none" @change="onFile">

        <div class="seg" v-if="hasData">
            <button class="btn" :class="{on: mode==='red'}" @click="setMode('red')" title="红公事（喜庆：婚嫁等）">❤️ 红</button>
            <button class="btn" :class="{on: mode==='white'}" @click="setMode('white')" title="白公事（素/丧：白事等）">🤍 白</button>
        </div>


        <template v-if="hasData">
            <button class="btn" @click="first" title="跳到封面">封面</button>
            <button class="btn" @click="prev" title="上一页">‹ 上一页</button>
            <span class="pgnum">{{ cur }} / {{ total }}</span>
            <button class="btn" @click="next" title="下一页">下一页 ›</button>
            <button class="btn" @click="last" title="跳到封底">封底</button>
            <button class="btn" @click="tocOpen=!tocOpen" title="打开/关闭目录">☰ 目录</button>
        </template>

        <div class="sp"></div>
        <span class="filetag" v-if="fileName" :title="fileName">{{ fileName }}</span>
    </div>

    <!-- ============ 舞台 ============ -->
    <div class="stage" ref="stage"
         @dragover.prevent="dragOver=true" @dragleave="dragOver=false" @drop.prevent="onDrop">
        <div class="dropmask" v-show="dragOver">松开以导入 JSON / PDF</div>

        <div class="empty-tip" v-if="!hasData">
            <div class="big">📖</div>
            <h3>把礼簿摊开成一本书</h3>
            <p>
                导入 <b>JSON</b>：阅读器自排成竖排记账书，红/白自动判定，前后配通用记账封面。<br>
                导入 <b>PDF</b>：逐页直渲成翻页书，可选用通用书壳补齐封面/封底。<br>
                纯前端本地解析，<b>不上传任何数据</b>。
            </p>
        </div>

        <div class="book-wrap" v-show="hasData">
            <div class="book-shell">
                <div id="book" ref="book"></div>
            </div>
        </div>

        <!-- 目录抽屉 -->
        <div class="toc" :class="{open: tocOpen}" v-if="hasData">
            <h4>目录</h4>
            <div class="thumb" v-for="(t,i) in tocItems" :key="i" @click="goPage(t.page)">
                <div class="mini" v-html="t.mini"></div>
                <div class="cap">{{ t.label }}</div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    // —— 解析翻页组件全局（page-flip UMD 名称不定，多路兜底）——
    var STP = (function () {
        var S = window.St || {};
        return S.PageFlip || S.StPageFlip
            || (window['page-flip'] && (window['page-flip'].PageFlip || window['page-flip'].StPageFlip))
            || window.pageFlip || window.StPageFlip
            || (typeof window.PageFlip === 'function' ? window.PageFlip : null) || null;
    })();

    // —— 页面设计尺寸（A4 横版，96dpi 下与打印页 29.7×21cm 等比）——
    var PAGE_W = 1123, PAGE_H = 794;
    var ITEMS_PER_PAGE = 20, APPENDIX_PER_PAGE = 18, EXPENSE_PER_PAGE = 18;

    // —— 竖排内页几何（照搬打印页 buildVerticalBook 的 pt 计算）——
    var PAGE_H_CM = 20.9, PAGE_W_CM = 29.7, PADDING_H_CM = 1, FOOTER_H_CM = 1.5;
    var BODY_H_CM = PAGE_H_CM - PADDING_H_CM - FOOTER_H_CM;
    var ROW_H_PT = (BODY_H_CM / 3) * 28.35;
    var CELL_PAD_PT = 8;
    var NAME_AVAIL_PT = ROW_H_PT - CELL_PAD_PT;
    var AMOUNT_AVAIL_PT = ROW_H_PT - CELL_PAD_PT - 22;
    var COL_W_PT = ((PAGE_W_CM - 3.7) / ITEMS_PER_PAGE) * 28.35;
    var NUM_AVAIL_W_PT = COL_W_PT - 6;

    // ============ 复用工具（抽自打印页）============
    function escapeHtml(str) {
        if (!str) return "";
        return String(str).replace(/[&<>"']/g, function (m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }

    function numberToChinese(n) {
        if (isNaN(n) || n === null || n === 0) return "零元整";
        n = parseFloat(n); n = Math.round(n * 100) / 100;
        var integerPart = Math.floor(n);
        var decimalPart = Math.round((n - integerPart) * 100);
        if (decimalPart === 100) { integerPart++; decimalPart = 0; }
        var cn = ["零","壹","贰","叁","肆","伍","陆","柒","捌","玖"];
        var units = ["","拾","佰","仟"]; var bigUnits = ["","万","亿"];
        function convertInt(num) {
            if (num === 0) return "";
            var str = "", bigIdx = 0;
            while (num > 0) {
                var part = num % 10000;
                if (part > 0) {
                    var partStr = "", p = part, pos = 0, needZero = false;
                    while (p > 0) {
                        var d = p % 10;
                        if (d > 0) { partStr = cn[d] + units[pos] + partStr; needZero = false; }
                        else { if (!needZero && partStr !== "") { partStr = "零" + partStr; needZero = true; } }
                        p = Math.floor(p / 10); pos++;
                    }
                    str = partStr + (bigIdx > 0 ? bigUnits[bigIdx] : "") + str;
                }
                num = Math.floor(num / 10000); bigIdx++;
            }
            return str;
        }
        var result = "";
        if (integerPart > 0) result = convertInt(integerPart) + "元"; else result = "零元";
        if (decimalPart > 0) {
            var jiao = Math.floor(decimalPart / 10); var fen = decimalPart % 10;
            if (jiao > 0) result += cn[jiao] + "角";
            if (fen > 0) result += cn[fen] + "分";
        } else { result += "整"; }
        return result;
    }

    function fitVerticalFontSize(text, availPt, basePt, minPt) {
        var len = (text || "").length; if (len === 0) return basePt;
        var lineHeight = 1.05, spacingPt = 2, spacingTotal = (len - 1) * spacingPt;
        var fs = (availPt - spacingTotal) / (len * lineHeight);
        if (fs > basePt) fs = basePt; if (fs < minPt) fs = minPt; return fs;
    }
    function fitHorizontalFontSize(text, availWidthPt, basePt, minPt) {
        var len = (text || "").length; if (len === 0) return basePt;
        var fs = availWidthPt / (len * 0.55);
        if (fs > basePt) fs = basePt; if (fs < minPt) fs = minPt; return fs;
    }

    // ============ JSON 兼容解析（抽自打印页 parseBookData，去掉未被内页使用的 payment/attendance 检测）============
    function parseBookData(rawJson) {
        var gifts = [], expenses = [];
        var event = { main: "", type: "", date: "", location: "", exportDate: "", theme: "", publicAffairType: "" };
        function mapGifts(arr) {
            return (arr || []).map(function (g) {
                return {
                    giver: g.giver || g.name || "",
                    relationship: g.relationship || g.remarks || "",
                    amount: Number(g.amount) || 0,
                    type: g.type || "",
                    note: g.note || g.remarks || "",
                    remarks: g.remarks || ""
                };
            });
        }
        function mapExp(arr) {
            return (arr || []).map(function (e) {
                return { item: e.item || e.name || e.project || "", amount: Number(e.amount) || 0, date: e.date || "", note: e.note || e.remarks || "" };
            });
        }
        if (rawJson.event && rawJson.gifts && rawJson.expenses !== undefined) {
            event.main = rawJson.event.name || "";
            event.type = rawJson.event.publicAffairType || rawJson.event.theme || rawJson.event.type || "";
            event.theme = rawJson.event.theme || ""; event.publicAffairType = rawJson.event.publicAffairType || "";
            var s1 = rawJson.event.startDateTime ? new Date(rawJson.event.startDateTime).toLocaleDateString('zh-CN') : "";
            var e1 = rawJson.event.endDateTime ? new Date(rawJson.event.endDateTime).toLocaleDateString('zh-CN') : "";
            event.date = (s1 && e1) ? (s1 === e1 ? s1 : s1 + ' 至 ' + e1) : (s1 || e1 || "");
            event.location = rawJson.event.location || rawJson.location || "";
            gifts = mapGifts(rawJson.gifts); expenses = mapExp(rawJson.expenses);
        } else if (rawJson.proxyBasicInfo && rawJson.proxyGifts) {
            var b = rawJson.proxyBasicInfo;
            event.main = b.organizer || "";
            event.type = b.publicAffairType || b.theme || b.type || "";
            event.theme = b.theme || ""; event.publicAffairType = b.publicAffairType || "";
            event.date = b.accountingDate ? new Date(b.accountingDate).toLocaleDateString() : "";
            event.location = b.location || rawJson.location || "";
            gifts = mapGifts(rawJson.proxyGifts); expenses = mapExp(rawJson.proxyExpenses);
        } else if (rawJson.eventInfo && rawJson.gifts) {
            var info = rawJson.eventInfo;
            event.main = info.name || "";
            event.type = info.publicAffairType || info.theme || info.type || "";
            event.theme = info.theme || ""; event.publicAffairType = info.publicAffairType || "";
            var s3 = info.startDateTime ? new Date(info.startDateTime).toLocaleDateString('zh-CN') : "";
            var e3 = info.endDateTime ? new Date(info.endDateTime).toLocaleDateString('zh-CN') : "";
            event.date = (s3 && e3) ? (s3 === e3 ? s3 : s3 + ' 至 ' + e3) : (s3 || e3 || "");
            event.location = info.location || rawJson.location || "";
            gifts = mapGifts(rawJson.gifts); expenses = mapExp(rawJson.expenses);
        } else if (rawJson.gifts && Array.isArray(rawJson.gifts)) {
            event.main = rawJson.eventName || "礼簿登记";
            event.type = rawJson.publicAffairType || rawJson.theme || rawJson.type || "";
            event.theme = rawJson.theme || ""; event.publicAffairType = rawJson.publicAffairType || "";
            event.date = rawJson.date || ""; event.location = rawJson.location || "";
            gifts = mapGifts(rawJson.gifts); expenses = mapExp(rawJson.expenses);
        } else { throw new Error("JSON 格式不支持，请使用标准礼簿格式"); }
        gifts = gifts.map(function (g) { return { giver: g.giver, relationship: g.relationship, amount: isNaN(g.amount) ? 0 : g.amount, type: g.type, note: g.note, remarks: g.remarks }; });
        expenses = expenses.map(function (e) { return { item: e.item, amount: isNaN(e.amount) ? 0 : e.amount, date: e.date, note: e.note }; });
        return { gifts: gifts, expenses: expenses, event: event };
    }

    // ============ 红白自动判定（抽自打印页 detectModeFromEvent）============
    function detectModeFromEvent(rawJson) {
        var src = (rawJson && (rawJson.event || rawJson.eventInfo || rawJson.proxyBasicInfo)) || rawJson || {};
        var theme = ((src.theme || "") + "").toLowerCase();
        if (theme.indexOf("solemn") >= 0) return "white";
        if (theme.indexOf("festive") >= 0) return "red";
        var txt = (src.publicAffairType || "") + " " + (src.type || "") + " " + ((rawJson && rawJson.publicAffairType) || "");
        if (/(白|丧|奠|悼|祭)/.test(txt)) return "white";
        if (/(红|紅|喜|婚|嫁)/.test(txt)) return "red";
        return null;
    }

    // ============ 书壳页 HTML 生成 ============
    function coverFrontHTML(mode, ev) {
        var isW = mode === 'white';
        var en = escapeHtml((ev && ev.main) || '礼簿');
        var meta = [(ev && ev.date) || '', ((ev && ev.location) || '').trim()].filter(Boolean).join('　·　');
        return '<div class="cover' + (isW ? ' white' : '') + '">'
            + '<div class="frame"></div>'
            + '<div class="cor tl"></div><div class="cor tr"></div><div class="cor bl"></div><div class="cor br"></div>'
            + '<div class="title-wrap"><div class="v-title">礼簿</div><div class="ename">' + en + '</div></div>'
            + '<div class="meta">' + escapeHtml(meta) + '</div>'
            + '</div>';
    }
    function coverBackHTML(mode) {
        var isW = mode === 'white';
        var stroke = isW ? '#4a5568' : '#d9b45b';
        return '<div class="cover' + (isW ? ' white' : '') + ' back">'
            + '<div class="frame"></div>'
            + '<div class="cor tl"></div><div class="cor tr"></div><div class="cor bl"></div><div class="cor br"></div>'
            + '<div class="bk-emblem">'
            + '<svg class="seal" width="160" height="160" viewBox="0 0 200 200">'
            + '<circle cx="100" cy="100" r="90" fill="none" stroke="' + stroke + '" stroke-width="6"/>'
            + '<circle cx="100" cy="100" r="73" fill="none" stroke="' + stroke + '" stroke-width="3"/>'
            + '<text x="100" y="119" font-size="94" font-weight="bold" fill="' + stroke + '" text-anchor="middle" font-family="KaiTi,楷体,serif">礼</text>'
            + '</svg>'
            + '<div class="bk-brand">宝 哥 工 作 室</div>'
            + '</div></div>';
    }

    // 竖排记账内页（复刻打印页 buildVerticalBook 结构，产出多张 .vb-page）
    function buildVbPage(inner, footer) {
        return '<div class="page"><div class="page-inner"><div class="vb">' + inner + footer + '</div></div></div>';
    }

    function statHTML(app) {
        var gifts = app.gifts, exp = app.expenses;
        var isW = app.mode === 'white';
        var giftTotal = gifts.reduce(function (s, g) { return s + (Number(g.amount) || 0); }, 0);
        var expTotal = exp.reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);
        var guest = gifts.length;
        var avg = guest ? giftTotal / guest : 0;
        var net = giftTotal - expTotal;
        var amounts = gifts.map(function (g) { return Number(g.amount) || 0; });
        var mx = amounts.length ? Math.max.apply(null, amounts) : 0;
        var mn = amounts.length ? Math.min.apply(null, amounts) : 0;
        function kv(k, v) { return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
        return '<div class="stat' + (isW ? ' white' : '') + '">'
            + '<h2>汇总统计</h2>'
            + '<div class="grid">'
            + kv('礼金总额', '¥ ' + giftTotal.toFixed(2))
            + kv('支出总额', '¥ ' + expTotal.toFixed(2))
            + kv('宾客笔数', guest + ' 笔')
            + kv('结余', '¥ ' + net.toFixed(2))
            + kv('人均礼金', '¥ ' + avg.toFixed(2))
            + kv('单笔最高 / 最低', '¥ ' + mx.toFixed(2) + ' / ' + mn.toFixed(2))
            + '</div>'
            + '<div class="note">宝哥工作室 · 礼簿阅读器</div>'
            + '</div>';
    }

    // ============ Vue 应用 ============
    var app = Vue.createApp({
        data: function () {
            return {
                hasData: false, sourceType: '', mode: 'red',
                fileName: '', cur: 1, total: 1, tocOpen: false, dragOver: false,
                gifts: [], expenses: [], event: {}, pdfImages: [], tocItems: [],
                _flip: null
            };
        },
        methods: {
            setMode: function (m) {
                if (this.mode === m) return;
                this.mode = m;
                if (!this.hasData) return;
                this._applyModeToDOM();
            },
            _applyModeToDOM: function () {
                var book = this.$refs.book; if (!book) return;
                var isW = this.mode === 'white';
                var typeText = isW ? '奠 仪' : '贺 礼';
                book.querySelectorAll('.cover').forEach(function (el) { el.classList.toggle('white', isW); });
                book.querySelectorAll('.vb').forEach(function (el) { el.classList.toggle('white', isW); });
                book.querySelectorAll('.stat').forEach(function (el) { el.classList.toggle('white', isW); });
                book.querySelectorAll('.vb-type-cell').forEach(function (el) { el.textContent = typeText; });
            },
            pickFile: function () { this.$refs.fileInput.click(); },
            onFile: function (e) { var f = e.target.files[0]; if (f) this.loadFile(f); e.target.value = ''; },
            onDrop: function (e) { this.dragOver = false; var f = e.dataTransfer.files && e.dataTransfer.files[0]; if (f) this.loadFile(f); },
            loadFile: function (file) {
                var name = file.name || '';
                this.clearAll();
                if (/\.pdf$/i.test(name) || file.type === 'application/pdf') this.readPdf(file);
                else if (/\.json$/i.test(name) || file.type === 'application/json') this.readJson(file);
                else alert('请导入 .json 或 .pdf 文件');
            },
            readJson: function (file) {
                var self = this, r = new FileReader();
                r.onload = function (ev) {
                    try {
                        var obj = JSON.parse(ev.target.result);
                        var res = parseBookData(obj);
                        if (!res.gifts.length && !res.expenses.length) throw new Error('未检测到礼金或支出记录');
                        self.gifts = res.gifts; self.expenses = res.expenses; self.event = res.event;
                        self.sourceType = 'json'; self.pdfImages = [];
                        var m = detectModeFromEvent(obj); self.mode = m || 'red';
                        self.fileName = file.name + (m ? '' : '（未识别红/白，可手动切换）');
                        self.hasData = true; self.tocOpen = false; self.$nextTick(function () { self.rebuild(); });
                    } catch (err) { alert('解析失败：' + err.message); }
                };
                r.onerror = function () { alert('文件读取失败'); };
                r.readAsText(file, 'utf-8');
            },
            readPdf: async function (file) {
                if (!window.pdfjsLib) { alert('PDF 组件未就绪'); return; }
                try {
                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
                    var buf = await file.arrayBuffer();
                    var pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
                    var imgs = [];
                    for (var i = 1; i <= pdf.numPages; i++) {
                        var pg = await pdf.getPage(i);
                        var vp1 = pg.getViewport({ scale: 1 });
                        var scale = Math.max(1, Math.min(2.5, 1600 / vp1.width));
                        var vp = pg.getViewport({ scale: scale });
                        var c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
                        var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
                        await pg.render({ canvasContext: ctx, viewport: vp }).promise;
                        imgs.push(c.toDataURL('image/jpeg', 0.85));
                    }
                    this.pdfImages = imgs; this.sourceType = 'pdf'; this.fileName = file.name;
                    this.hasData = true; this.tocOpen = false; this.$nextTick(() => this.rebuild());
                } catch (e) { alert('PDF 渲染失败：' + (e && e.message ? e.message : e)); }
            },

            buildInnerPages: function () {
                var self = this, pages = [];
                var ev = this.event, isW = this.mode === 'white';
                var eventName = (ev.main || '礼簿') + '';
                var eventDate = ev.date || '';
                var typeText = isW ? '奠 仪' : '贺 礼';
                var vbcls = isW ? ' white' : '';
                var giftTotal = this.gifts.reduce(function (s, g) { return s + (Number(g.amount) || 0); }, 0);

                if (this.gifts.length > 0) {
                    var totalPages = Math.ceil(this.gifts.length / ITEMS_PER_PAGE);
                    for (var p = 0; p < totalPages; p++) {
                        var pageItems = this.gifts.slice(p * ITEMS_PER_PAGE, (p + 1) * ITEMS_PER_PAGE);
                        var nameRow = '', typeRow = '', amountRow = '';
                        for (var i = 0; i < ITEMS_PER_PAGE; i++) {
                            var gift = pageItems[i];
                            if (gift) {
                                var nm = gift.giver || '';
                                var fs = fitVerticalFontSize(nm, NAME_AVAIL_PT, 24, 8);
                                nameRow += '<div class="vb-cell vb-name-cell"><div class="vb-name" style="font-size:' + fs.toFixed(2) + 'pt">' + escapeHtml(nm) + '</div></div>';
                            } else { nameRow += '<div class="vb-cell vb-name-cell"></div>'; }
                            typeRow += '<div class="vb-cell vb-type-cell">' + typeText + '</div>';
                            if (gift) {
                                var cnText = numberToChinese(gift.amount);
                                var cnFs = fitVerticalFontSize(cnText, AMOUNT_AVAIL_PT, 22, 8);
                                var numText = '¥' + Number(gift.amount).toFixed(2);
                                var numFs = fitHorizontalFontSize(numText, NUM_AVAIL_W_PT, 9, 6);
                                amountRow += '<div class="vb-cell vb-amount-cell">'
                                    + '<div class="vb-amount-chinese" style="font-size:' + cnFs.toFixed(2) + 'pt">' + escapeHtml(cnText) + '</div>'
                                    + '<div class="vb-amount-numeric" style="font-size:' + numFs.toFixed(2) + 'pt">' + escapeHtml(numText) + '</div></div>';
                            } else { amountRow += '<div class="vb-cell vb-amount-cell"></div>'; }
                        }
                        var body = '<div class="vb-body">'
                            + '<div class="vb-row">' + nameRow + '</div>'
                            + '<div class="vb-row">' + typeRow + '</div>'
                            + '<div class="vb-row">' + amountRow + '</div></div>';
                        var inner = '<div class="vb-side-title">' + escapeHtml(eventName) + '礼金明细</div>' + body;
                        var subtotal = pageItems.reduce(function (s, g) { return s + (Number(g.amount) || 0); }, 0);
                        var footer = '<div class="vb-footer"><p>日期: ' + escapeHtml(eventDate) + '</p>'
                            + '<p class="vb-page-number">礼金 ' + (p + 1) + '/' + totalPages + '页</p>'
                            + '<div class="vb-footer-totals"><span>本页小计: ¥' + subtotal.toFixed(2) + '</span>'
                            + '<span>总金额: ¥' + giftTotal.toFixed(2) + '</span><span>共' + this.gifts.length + '条记录</span></div></div>';
                        pages.push({ html: buildVbPage(inner, footer), label: '礼金 ' + (p + 1) + '/' + totalPages, cat: 'vb', page: pages.length });
                    }
                }

                var remarked = this.gifts.filter(function (g) { return g.note && String(g.note).trim() !== ''; });
                if (remarked.length > 0) {
                    var at = Math.ceil(remarked.length / APPENDIX_PER_PAGE);
                    for (var ap = 0; ap < at; ap++) {
                        var items = remarked.slice(ap * APPENDIX_PER_PAGE, (ap + 1) * APPENDIX_PER_PAGE);
                        var rows = '';
                        items.forEach(function (item) {
                            var oi = self.gifts.indexOf(item);
                            rows += '<tr><td>' + escapeHtml(item.giver || '') + '</td><td>第' + (Math.floor(oi / ITEMS_PER_PAGE) + 1) + '页第' + ((oi % ITEMS_PER_PAGE) + 1) + '位</td><td>' + escapeHtml(item.note || '') + '</td></tr>';
                        });
                        var ain = '<div class="vb-side-title">附录：宾客备注</div>'
                            + '<div class="vb-body" style="border:0"><table class="vb-appendix-table"><thead><tr><th>姓名</th><th>记录位置</th><th>备注信息</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
                        var af = '<div class="vb-footer"><p>日期: ' + escapeHtml(eventDate) + '</p><p class="vb-page-number">附录 ' + (ap + 1) + '/' + at + ' 页</p><div></div></div>';
                        pages.push({ html: '<div class="page"><div class="page-inner"><div class="vb">' + ain + af + '</div></div></div>', label: '附录 ' + (ap + 1) + '/' + at, cat: 'vb', page: pages.length });
                    }
                }

                if (this.expenses.length > 0) {
                    var et = Math.ceil(this.expenses.length / EXPENSE_PER_PAGE);
                    var expTotal = this.expenses.reduce(function (s, e) { return s + (Number(e.amount) || 0); }, 0);
                    for (var ep = 0; ep < et; ep++) {
                        var eitems = this.expenses.slice(ep * EXPENSE_PER_PAGE, (ep + 1) * EXPENSE_PER_PAGE);
                        var erows = '';
                        eitems.forEach(function (e) {
                            erows += '<tr><td>' + escapeHtml(e.item || '') + '</td><td>¥' + Number(e.amount).toFixed(2) + '</td><td>' + escapeHtml(e.date || '') + '</td><td>' + escapeHtml(e.note || '无') + '</td></tr>';
                        });
                        var ein = '<div class="vb-side-title">' + escapeHtml(eventName) + '支出明细</div>'
                            + '<div class="vb-body" style="border:0"><table class="vb-expense-table"><thead><tr><th>支出项目</th><th>金额</th><th>日期</th><th>备注</th></tr></thead><tbody>' + erows + '</tbody></table></div>';
                        var ef = '<div class="vb-footer"><p>日期: ' + escapeHtml(eventDate) + '</p><p class="vb-page-number">支出 ' + (ep + 1) + '/' + et + '页</p><div class="vb-footer-totals"><span>总支出: ¥' + expTotal.toFixed(2) + '</span></div></div>';
                        pages.push({ html: '<div class="page"><div class="page-inner"><div class="vb">' + ein + ef + '</div></div></div>', label: '支出 ' + (ep + 1) + '/' + et, cat: 'vb', page: pages.length });
                    }
                }
                return pages;
            },

            destroyFlip: function () {
                if (this._flip) { try { this._flip.destroy(); } catch (e) { } this._flip = null; }
                // page-flip.destroy() 会移除传入的 flip 块；#book 宿主保留，下次重建再新建块即可
                this._flipBlock = null;
            },

            clearAll: function () {
                this.destroyFlip();
                var host = this.$refs.book;
                if (host) { host.innerHTML = ''; host.style.removeProperty('--ps'); }
                this.hasData = false; this.sourceType = ''; this.gifts = []; this.expenses = [];
                this.event = {}; this.pdfImages = []; this.tocItems = []; this.cur = 1; this.total = 1;
                this.fileName = ''; this.tocOpen = false;
            },

            rebuild: function () {
                var self = this;
                this.destroyFlip();
                var host = this.$refs.book; if (!host) return;
                host.innerHTML = '';
                var pages = [];
                if (this.sourceType === 'json') {
                    pages.push({ html: '<div class="page"><div class="page-inner">' + coverFrontHTML(this.mode, this.event) + '</div></div>', label: '封面', cat: 'cover' });
                    pages.push({ html: '<div class="page blank"></div>', label: '内封', cat: 'blank' });
                    this.buildInnerPages().forEach(function (x) { pages.push(x); });
                    pages.push({ html: '<div class="page"><div class="page-inner">' + statHTML(this) + '</div></div>', label: '汇总', cat: 'stat' });
                    pages.push({ html: '<div class="page blank"></div>', label: '白页', cat: 'blank' });
                    pages.push({ html: '<div class="page"><div class="page-inner">' + coverBackHTML(this.mode) + '</div></div>', label: '封底', cat: 'back' });
                } else if (this.sourceType === 'pdf') {
                    this.pdfImages.forEach(function (img, i) { pages.push({ html: '<div class="page"><img class="vf" src="' + img + '"></div>', label: (i === 0 ? '封面 · PDF' : '第' + (i + 1) + '页'), cat: (i === 0 ? 'cover' : 'pdf') }); });
                    pages.push({ html: '<div class="page blank"></div>', label: '白页', cat: 'blank' });
                    pages.push({ html: '<div class="page"><div class="page-inner">' + coverBackHTML(this.mode) + '</div></div>', label: '通用封底', cat: 'back' });
                }
                // 每次新建一个游离翻页块交给 page-flip：destroy() 删的是它，#book 宿主永不消失 → 杜绝二次重建白屏
                var flipBlock = document.createElement('div');
                flipBlock.className = 'flip-book';
                flipBlock.innerHTML = pages.map(function (p) { return p.html; }).join('');
                host.appendChild(flipBlock);
                this._flipBlock = flipBlock;

                this.tocItems = pages.map(function (p, i) {
                    return { page: i + 1, label: p.label, mini: self.miniHTML(p.cat) };
                });
                this.total = pages.length; this.cur = 1;

                this.layout();
                if (!STP) { alert('翻页组件未就绪'); return; }
                this._flip = new STP(flipBlock, {
                    width: PAGE_W, height: PAGE_H, size: 'stretch',
                    showCover: true, usePortrait: false,
                    maxShadowOpacity: 0.7, mobileScrollSupport: false, flippingTime: 800, drawShadow: true,
                    flippingArea: 0.34
                });
                this._flip.loadFromHTML(flipBlock.querySelectorAll('.page'));
                this._flip.on('flip', function () { self.cur = self._flip.getCurrentPageIndex() + 1; });
                this.$nextTick(function () { self.layout(); self.scaleContent(); });
            },

            scaleContent: function () {
                var host = this.$refs.book; if (!host) return;
                var pg = host.querySelector('.page'); if (!pg) return;
                var pw = pg.offsetWidth; if (!pw) return;
                host.style.setProperty('--ps', pw / PAGE_W);
            },

            miniHTML: function (cat) {
                var base = 'width:180px;height:127px;position:relative;overflow:hidden;border-radius:3px;';
                if (cat === 'cover') return '<div class="mini-box" style="' + base + (this.mode === 'white' ? 'background:#f2ece1;' : 'background:#b23b2e;') + 'color:' + (this.mode === 'white' ? '#2f3b45' : '#f3e2c0') + ';display:flex;align-items:center;justify-content:center;font-family:KaiTi,serif;letter-spacing:4px">礼簿</div>';
                if (cat === 'back') return '<div class="mini-box" style="' + base + (this.mode === 'white' ? 'background:#f2ece1;' : 'background:#b23b2e;') + '"></div>';
                if (cat === 'blank') return '<div class="mini-box" style="' + base + 'background:#faf6ee;border:1px solid #e8e0d0"></div>';
                if (cat === 'stat') return '<div class="mini-box" style="' + base + 'background:#fff;border:1px solid #e2d9c6;color:#999;display:flex;align-items:center;justify-content:center;font-size:12px">汇总</div>';
                if (cat === 'pdf') return '<div class="mini-box" style="' + base + 'background:#fff;border:1px solid #e2d9c6;color:#bbb;display:flex;align-items:center;justify-content:center;font-size:12px">PDF</div>';
                return '<div class="mini-box" style="' + base + 'background:repeating-linear-gradient(90deg,#fff,#fff 8px,#eee 8px,#eee 9px);border:1px solid #e2d9c6"></div>';
            },

            layout: function () {
                var stage = this.$refs.stage, host = this.$refs.book, shell = host && host.parentElement;
                if (!stage || !shell) return;
                // 永远对开：书本整体宽高比 = (PAGE_W*2) : PAGE_H，把书壳按舞台可用区等比铺满（组件原生 stretch 适配，拖角坐标正确）
                var ratio = PAGE_H / (PAGE_W * 2);
                var availW = Math.max(120, stage.clientWidth - 60), availH = Math.max(120, stage.clientHeight - 60);
                var w = availW, h = w * ratio;
                if (h > availH) { h = availH; w = h / ratio; }
                shell.style.width = Math.round(w) + 'px';
                shell.style.height = Math.round(h) + 'px';
                // 内容缩放比：对开每页实宽 = 壳宽/2，直接推算写进 --ps，不依赖 page-flip 渲染时机
                host.style.setProperty('--ps', (w / 2) / PAGE_W);
            },

            next: function () { this._flip && this._flip.flipNext(); },
            prev: function () { this._flip && this._flip.flipPrev(); },
            first: function () { this._flip && this._flip.flip(0); },
            last: function () { this._flip && this._flip.flip(Math.max(0, this.total - 1)); },
            goPage: function (i) { if (!this._flip) return; var idx = Math.max(0, Math.min(this.total - 1, i - 1)); this._flip.flip(idx); this.cur = idx + 1; }
        },
        mounted: function () {
            var self = this;
            this._onKey = function (e) {
                if (!self.hasData) return;
                if (e.key === 'ArrowRight' || e.key === 'PageDown') self.next();
                else if (e.key === 'ArrowLeft' || e.key === 'PageUp') self.prev();
            };
            window.addEventListener('keydown', this._onKey);
            this._onResize = function () { if (self.hasData) { self.layout(); requestAnimationFrame(function () { self.scaleContent(); }); } };
            window.addEventListener('resize', this._onResize);
            this._wheelLock = false;
            this._onWheel = function (e) {
                if (!self.hasData || !self._flip || self.tocOpen) return;
                if (self._wheelLock) return;
                self._wheelLock = true;
                setTimeout(function () { self._wheelLock = false; }, 550);
                if (e.deltaY > 0) self.next(); else if (e.deltaY < 0) self.prev();
            };
            if (this.$refs.stage) this.$refs.stage.addEventListener('wheel', this._onWheel, { passive: true });
        },
        beforeUnmount: function () {
            this.destroyFlip();
            window.removeEventListener('keydown', this._onKey);
            window.removeEventListener('resize', this._onResize);
            if (this.$refs.stage && this._onWheel) this.$refs.stage.removeEventListener('wheel', this._onWheel);
        }
    });
    app.mount('#app');
})();
</script>
