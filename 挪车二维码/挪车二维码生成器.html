  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快点挪车二维码生成器</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://pan.653827.xyz/raw/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Hiragino Sans', Arial, sans-serif;
      background: #f5f6fa;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .error {
      color: #e74c3c;
      font-size: 0.95em;
      margin-top: 4px;
    }
    .center-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding-top: 40px;
    }
    .panda-box {
      position: relative;
      width: 340px;
      margin-bottom: 0;
      z-index: 2;
    }
    .login-container {
      position: relative;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px #0002;
      padding: 40px 28px 28px 28px;
      width: 340px;
      z-index: 10;
      margin-top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1.5px solid #e0e7ff;
    }
    .login-title {
      text-align: center;
      font-size: 1.5em;
      color: #22223b;
      margin-bottom: 28px;
      letter-spacing: 2px;
      width: 100%;
    }
    .form-group {
      margin-bottom: 18px;
      width: 100%;
      position: relative;
      z-index: 100;
      pointer-events: auto;
    }
    .username-label {
      width: 100%;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
      color: #6366f1;
      letter-spacing: 2px;
      display: block;
      margin-bottom: 12px;
    }
    .username-input-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .username-input {
      background: #f5f6fa;
      color: #6366f1;
      font-size: 1.4em;
      font-weight: bold;
      text-align: center;
      border: none;
      box-shadow: none;
      outline: none;
      width: 80%;
      margin-bottom: 0.5em;
    }
    input[type="password"], input[type="tel"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #bfc4d1;
      border-radius: 6px;
      font-size: 1.1em;
      background: #f5f6fa;
      transition: border 0.2s;
      color: #22223b;
      position: relative;
      z-index: 100;
      -webkit-user-select: text;
      user-select: text;
    }
    input[type="password"]:focus, input[type="tel"]:focus {
      border-color: #6366f1;
      outline: none;
    }
    .login-btn {
      display: block;
      margin: 0 auto;
      margin-top: 18px;
      width: 70%;
      padding: 14px 0;
      background: #6366f1 !important;
      color: #fff !important;
      border: none;
      border-radius: 8px;
      font-size: 1.25em;
      font-weight: 600;
      letter-spacing: 2px;
      box-shadow: 0 2px 8px #6366f11a;
      transition: background 0.2s, box-shadow 0.2s;
      text-align: center;
    }
    .login-btn:hover {
      background: #4f46e5 !important;
    }
    .login-footer {
      text-align: center;
      color: #aaa;
      font-size: 0.95em;
      margin-top: 18px;
      width: 100%;
    }
    .main-content {
      display: flex;
      flex-direction: row;
      gap: 2.5rem;
      align-items: stretch;
      justify-content: center;
      margin-top: 2.5rem;
      padding: 0 1rem;
    }
    .form-container {
      flex: 1;
      max-width: 420px;
      background: #fff;
      padding: 1.5rem 1.5rem 1.2rem 1.5rem;
      border-radius: 14px;
      box-shadow: 0 2px 12px #6366f11a;
      border: 2.5px solid #16a34a;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card-preview-container {
      flex: 1;
      max-width: 420px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #inputForm {
      width: 100%;
      max-width: 320px;
    }
    #cardContent {
      margin: 0 auto;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      background: #fff;
      border: 2.5px solid #16a34a;
      padding: 0;
      width: 420px !important;
      flex: 1; 
      min-height: 0;
      min-width: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
    }
    .card-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.4rem 1.2rem 1.2rem 1.2rem;
    }
    .card-title {
      font-size: 1.35em;
      font-weight: 700;
      color: #22223b;
      margin-bottom: 0.35em;
      letter-spacing: 1px;
    }
    .card-subtitle {
      font-size: 1.05em;
      color: #6366f1;
      margin-bottom: 0.5em;
      transition: color 0.3s;
    }
    
    .scan-hint {
      margin: 0.4em auto 0 auto;
      width: fit-content;
      font-size: 0.95em;
      font-weight: 700;
      color: #b45309;
      background: #fef3c7;
      border: 1px dashed #f59e0b;
      border-radius: 20px;
      padding: 5px 14px;
      letter-spacing: 0.5px;
    }
    #qrcode {
      margin: 0 auto 0.5em auto;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 200px;
      height: 200px;
      background: #fff;
      border-radius: 8px;
      border: 3px solid #000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 10px;
      transition: all 0.3s;
    }
    .qr-placeholder {
      margin: 0 auto 1.2em auto;
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, #f5f6fa 0%, #e0e7ff 100%);
      border-radius: 8px;
      border: 3px dashed #6366f1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .qr-placeholder p {
      color: #6366f1;
      font-size: 0.85em;
      font-weight: 500;
      line-height: 1.5;
      margin: 0;
      padding: 0 8px;
    }
    .info-row {
      margin-top: 0.3em;
      font-size: 0.8em;
      color: #6b7280;
      letter-spacing: 0.5px;
      font-weight: 400;
      background: #f5f6fa;
      border-radius: 6px;
      border: 1px solid #e0e7ff;
      padding: 0.12em 0.6em;
      display: inline-block;
    }
    .action-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-top: 0.8em;
      width: 100%;
      gap: 0.7em;
    }
    .btn-primary, .btn-success, .btn-info {
      border-radius: 8px !important;
      font-size: 1em;
      font-weight: 500;
      box-shadow: 0 2px 8px #6366f11a;
      transition: background 0.2s, box-shadow 0.2s;
      width: 100%;
      padding: 7px 0;
      margin: 0;
      display: block;
      border: none;
      text-align: center;
    }
    .btn-primary { background: #6366f1 !important; color: #fff !important; }
    .btn-primary:hover { background: #4f46e5 !important; }
    .btn-success { background: #10b981 !important; color: #fff !important; }
    .btn-success:hover { background: #059669 !important; }
    .btn-info { background: #0ea5e9 !important; color: #fff !important; }
    .btn-info:hover { background: #0369a1 !important; }
    .btn-warning { background: #f59e0b !important; color: #fff !important; }
    .btn-warning:hover { background: #d97706 !important; }
    .btn-secondary { background: #6b7280 !important; color: #fff !important; }
    .btn-secondary:hover { background: #4b5563 !important; }
    
    #logoutBtn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(calc(230px + 8px), -50%) scale(0.8);
      margin-left: 0;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1.5px solid #16a34a;
      background: #fff;
      color: #16a34a;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      transition: background 0.2s, color 0.2s;
    }
    #logoutBtn:hover { background: #16a34a; color: #fff; }
    .copy-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 24px 32px;
      border-radius: 12px;
      font-size: 1em;
      font-weight: 500;
      line-height: 1.8;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.4s;
      max-width: 90%;
      text-align: center;
      display: none;
    }
    .copy-toast.show {
      opacity: 1;
      display: block;
    }
    .copy-toast .icon {
      font-size: 2em;
      margin-bottom: 12px;
    }
    .copy-toast .main-text {
      font-size: 1.1em;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .copy-toast .detail-text {
      font-size: 0.9em;
      opacity: 0.95;
    }
    .copy-toast .action-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 24px;
      background: #fff;
      color: #667eea;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      pointer-events: auto;
    }
    .copy-toast .action-btn:hover {
      transform: scale(1.05);
    }
    
    #designQrcodeMobile {
      width: 100%;
      max-width: 420px;
      padding: 7px 0;
      font-size: 1em;
      border-radius: 8px;
      border: none;
      color: #fff;
    }
    .style-option {
      cursor: pointer;
      position: relative;
      z-index: 10;
      pointer-events: auto;
    }
    .style-option input[type="radio"] {
      display: none;
    }
    .style-preview {
      display: block;
      padding: 8px 16px;
      border-radius: 8px;
      border: 2px solid #e0e7ff;
      font-size: 0.9em;
      transition: all 0.2s;
      text-align: center;
      pointer-events: none;
    }
    .style-option input:checked + .style-preview {
      border-color: #6366f1;
      box-shadow: 0 2px 8px rgba(99,102,241,0.2);
      transform: scale(1.05);
    }
    .style-preview.classic { background: #000000; color: #fff; }
    .style-preview.blue { background: #1e3a8a; color: #fff; }
    .style-preview.green { background: #166534; color: #fff; }
    .style-preview.purple { background: #581c87; color: #fff; }
    .style-preview.red { background: #991b1b; color: #fff; }
    @media (max-width: 900px) {
      .main-content { flex-direction: column; align-items: center; gap: 1.5rem; }
      .form-container, .card-preview-container { max-width: 98vw; width: 100%; height: auto; overflow: visible; }
      .card-preview-container { align-items: center; }
      #cardContent { flex: none; }
      #designQrcodeMobile { max-width: 98%; }
      #cardContent img {
        max-width: 300px !important;
        width: auto !important;
        height: auto !important;
        margin: 0 auto !important;
        display: block !important;
      }
    }
    @media (max-width: 500px) {
      .panda-box, .login-container, #cardContent { width: 96vw !important; min-width: 0; max-width: 98vw; }
      #cardContent { height: auto; min-height: 380px; }
      .card-body { padding: 1.2rem 0.2rem 1.2rem 0.2rem; }
      .btn-primary, .btn-success, .btn-info { width: 98%; }
    }
    @media print {
      body { background: #fff !important; }
      #cardContent, .login-container, .form-container { box-shadow: none !important; border: none !important; }
      .btn, .action-group, .login-btn { display: none !important; }
    }
  </style>
</head>
<body>
  <!-- 登录页面 -->
  <div id="loginPage" style="display: block;">
    <div class="center-box">
      <div class="panda-box">
        <!-- 熊猫SVG -->
        <svg width="340" height="180" viewBox="0 0 340 180" fill="none" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="70" cy="60" rx="36" ry="28" fill="#222"/>

          <ellipse cx="120" cy="110" rx="22" ry="16" fill="#222"/>
          <ellipse cx="220" cy="110" rx="22" ry="16" fill="#222"/>
          <ellipse cx="120" cy="115" rx="7" ry="7" fill="#fff"/>
          <ellipse cx="220" cy="115" rx="7" ry="7" fill="#fff"/>
          <ellipse cx="120" cy="117" rx="3" ry="3" fill="#222"/>
          <ellipse cx="220" cy="117" rx="3" ry="3" fill="#222"/>
          <ellipse cx="170" cy="135" rx="10" ry="7" fill="#222"/>
          <path d="M160 145 Q170 155 180 145" stroke="#222" stroke-width="3" fill="none"/>
          <ellipse cx="90" cy="170" rx="28" ry="18" fill="#222"/>
          <ellipse cx="90" cy="170" rx="12" ry="8" fill="#fff"/>
          <ellipse cx="250" cy="170" rx="28" ry="18" fill="#222"/>
          <ellipse cx="250" cy="170" rx="12" ry="8" fill="#fff"/>

          <ellipse cx="230" cy="160" rx="16" ry="10" fill="#222"/>
        </svg>
      </div>
      <div class="login-container">
        <div class="login-title"></div>
        <form id="loginForm" style="width:100%;">
          <div class="form-group">
            <label for="username" class="username-label">   </label>
            <div class="username-input-wrapper">
              <input type="text" id="username" name="username" value="宝哥专用" readonly class="username-input">
