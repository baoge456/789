<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ouonnkitv 终极格式转换器</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; max-width: 900px; margin: auto; background: #f4f4f9; }
        .stats { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #ddd; display: flex; gap: 20px; font-weight: bold; }
        textarea { width: 100%; height: 200px; margin: 10px 0; font-family: monospace; border: 1px solid #ccc; padding: 10px; }
        .controls { margin: 10px 0; display: flex; gap: 10px; }
        button { padding: 10px 20px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>ouonnkitv 资源格式转换统计</h2>
    
    <div class="stats">
        <span>识别总量: <b id="total">0</b></span>
    </div>

    <input type="file" id="fileInput" accept=".json">
    <textarea id="inputArea" placeholder="支持三种格式：&#10;1. 原版 {api_site: {...}}&#10;2. 分组版 {settings: {sources: [...], premiumSources: [...]}}&#10;3. CatVod版 {spider: ..., sites: [...]}"></textarea>
    
    <div class="controls">
        <button onclick="convertData()">执行转换与统计</button>
        <button onclick="downloadResult()" style="background: #28a745;">下载 ouonnkitv.json</button>
    </div>
    <textarea id="outputArea" placeholder="转换结果..." readonly></textarea>

    <script>
        document.getElementById('fileInput').addEventListener('change', e => {
            const reader = new FileReader();
            reader.onload = e => document.getElementById('inputArea').value = e.target.result;
            reader.readAsText(e.target.files[0]);
        });

        function convertData() {
            const input = document.getElementById('inputArea').value;
            try {
                const data = JSON.parse(input);
                let result = [];

                // 1. CatVod 格式支持 (sites 数组)
                if (data.sites && Array.isArray(data.sites)) {
                    result = data.sites.map(s => ({
                        id: s.key,
                        name: s.name.replace(/[🎬🔞-]/g, '').trim(),
                        url: s.api.split('?')[0], // 提取 URL，去掉参数
                        detailUrl: s.ext || "",
                        isEnabled: true
                    }));
                } 
                // 2. 分组格式支持 (sources + premiumSources)
                else if (data.settings) {
                    const process = (arr) => (arr || []).map(s => ({
                        id: s.id, name: s.name, url: s.baseUrl, detailUrl: s.detailPath || s.baseUrl, isEnabled: s.enabled
                    }));
                    result = [...process(data.settings.sources), ...process(data.settings.premiumSources)];
                }
                // 3. 原格式支持 (api_site)
                else if (data.api_site) {
                    for (const key in data.api_site) {
                        const item = data.api_site[key];
                        result.push({ 
                            "id": key.replace(/\./g, '-'), 
                            "name": item.name.replace(/[🎬🔞-]/g, '').trim(), 
                            "url": item.api, 
                            "detailUrl": item.detail, 
                            "isEnabled": true 
                        });
                    }
                }

                document.getElementById('outputArea').value = JSON.stringify(result, null, 2);
                document.getElementById('total').innerText = result.length;
            } catch (e) { alert("解析失败，请检查 JSON 格式！错误信息：" + e.message); }
        }

        function downloadResult() {
            const data = document.getElementById('outputArea').value;
            const blob = new Blob([data], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'ouonnkitv.json';
            a.click();
        }
    </script>
</body>
</html>
